services:
  postgres:
    image: postgres:16
    container_name: dashboard-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  api:
    build: ./dashboard-api
    container_name: dashboard-api
    restart: unless-stopped
    env_file: ./dashboard-api/.env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./dashboard-ui
      args:
        # Baked into the browser bundle at build time, so it must be the
        # address the user's browser can reach (e.g. the EC2 public IP),
        # not an in-network service name.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: dashboard-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ai-gateway
    restart: unless-stopped
    env_file: ./gateway/.env
    ports:
      - "8000:8000"

  agent:
    build: ./agent_frontend
    container_name: agent-frontend
    restart: unless-stopped
    environment:
      # Containers share the compose network, so the gateway is reachable by
      # its service name rather than localhost or the EC2 public IP.
      GATEWAY_URL: http://gateway:8000
    ports:
      - "8501:8501"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata: